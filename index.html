<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI News Summarizer</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
    overflow-x: hidden;
}

/* HEADER */
.header {
    text-align: center;
    padding: 60px 20px 20px;
    animation: fadeDown 1s ease;
}

.header h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.header p {
    color: #94a3b8;
}

/* INPUT BOX */
.search-box {
    display: flex;
    justify-content: center;
    margin-top: 30px;
    gap: 10px;
    animation: fadeUp 1s ease;
}

input {
    width: 320px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    outline: none;
    background: #1e293b;
    color: white;
    font-size: 14px;
}

button {
    padding: 14px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    font-weight: 600;
    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* LOADER */
.loader {
    text-align: center;
    margin-top: 30px;
    display: none;
}

/* NEWS CONTAINER */
#output {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 40px;
}

/* NEWS CARD */
.card {
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 18px;
    transform: translateY(20px);
    opacity: 0;
    animation: popUp 0.6s ease forwards;
    transition: transform 0.3s;
}

.card:hover {
    transform: scale(1.03);
}

.card h3 {
    margin-top: 0;
    color: #38bdf8;
    font-size: 16px;
}

.card p {
    color: #cbd5e1;
    font-size: 14px;
    line-height: 1.5;
}

/* ANIMATIONS */
@keyframes fadeDown {
    from {opacity:0; transform: translateY(-30px);}
    to {opacity:1; transform: translateY(0);}
}

@keyframes fadeUp {
    from {opacity:0; transform: translateY(30px);}
    to {opacity:1; transform: translateY(0);}
}

@keyframes popUp {
    to {opacity:1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="header">
    <h1>📰 AI News Summarizer</h1>
    <p>Beautifully summarized AI-powered news blocks</p>
</div>

<div class="search-box">
    <input id="query" placeholder="Enter topic (AI, tech, world news...)">
    <button onclick="getSummary()">Generate</button>
</div>

<div class="loader" id="loader">Loading news...</div>

<div id="output"></div>

<script>
async function getSummary() {
    const query = document.getElementById("query").value;
    const loader = document.getElementById("loader");
    const output = document.getElementById("output");

    output.innerHTML = "";
    loader.style.display = "block";

    let res = await fetch("/summarize", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({query})
    });

    let data = await res.json();
    loader.style.display = "none";

    // split into bullet-like blocks
    let chunks = data.summary.split(". ");

    chunks.forEach((text, i) => {
        if (text.trim().length === 0) return;

        let card = document.createElement("div");
        card.className = "card";
        card.style.animationDelay = (i * 0.1) + "s";

        card.innerHTML = `
            <h3>News Point ${i + 1}</h3>
            <p>${text.trim()}</p>
        `;

        output.appendChild(card);
    });
}
</script>

</body>
</html>
